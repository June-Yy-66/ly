<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#292929">
  <title>&#36890;&#35759;&#24405; · iCity</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #111;
      --muted: #a4a4a4;
      --paper: #f2f0f1;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { width: 100%; margin: 0; }

    body {
      overflow-x: hidden;
      color: var(--ink);
      background: var(--paper);
      -webkit-font-smoothing: antialiased;
    }

    button { color: inherit; font: inherit; }

    .liuyue-screen {
      position: relative;
      display: flex;
      width: min(100vw, 384px);
      height: auto;
      min-height: 100dvh;
      margin: 0 auto;
      flex-direction: column;
      overflow: visible;
      container-type: inline-size;
      background: var(--paper);
    }

    .liuyue-topbar {
      position: relative;
      z-index: 2;
      flex: 0 0 26.3cqw;
      color: #f5f5f5;
      background: #292929;
    }

    .liuyue-statusbar {
      position: relative;
      display: flex;
      height: 15.7cqw;
      align-items: flex-start;
      justify-content: space-between;
      padding: 5.7cqw 8.5% 0;
      font-size: 3.7cqw;
      font-weight: 700;
      line-height: 1;
    }

    .liuyue-island {
      position: absolute;
      top: 2.9cqw;
      left: 50%;
      display: flex;
      width: 46cqw;
      height: 9.4cqw;
      align-items: center;
      padding-left: 2.3cqw;
      border-radius: 99px;
      background: #030303;
      transform: translateX(-50%);
    }

    .liuyue-island-mark { width: 6.1cqw; height: 6.1cqw; color: #76f58e; }

    .liuyue-status-right { display: flex; align-items: center; gap: 1.1cqw; }
    .liuyue-signal { width: 5.1cqw; height: 3.6cqw; }
    .liuyue-network { font-size: 3cqw; font-weight: 600; }
    .liuyue-battery { width: 6.7cqw; height: 3.6cqw; }

    .liuyue-back-button {
      position: absolute;
      top: 16.8cqw;
      left: 3cqw;
      display: grid;
      width: 8cqw;
      height: 8cqw;
      place-items: center;
      padding: 0;
      border: 0;
      color: #ededed;
      background: transparent;
    }

    .liuyue-back-button svg { width: 6.5cqw; height: 6.5cqw; }

    .liuyue-tabs {
      position: absolute;
      top: 16.5cqw;
      left: 50%;
      display: flex;
      width: 35.5cqw;
      height: 8.2cqw;
      align-items: center;
      padding: 1cqw;
      border: 1px solid #1c1c1c;
      border-radius: 4cqw;
      background: #202020;
      box-shadow: 0 0 0 1px rgba(0,0,0,.3), inset 0 1px 2px rgba(255,255,255,.04);
      transform: translateX(-50%);
    }

    .liuyue-tabs button {
      height: 14.2cqw;
      flex: 1;
      padding: 0;
      border: 0;
      border-radius: 2.5cqw;
      color: #e8e8e8;
      background: transparent;
      font-size: 3.6cqw;
      font-weight: 750;
      white-space: nowrap;
    }

    .liuyue-tabs button.liuyue-selected { background: #414141; }

    .liuyue-add-person {
      position: absolute;
      top: 16.4cqw;
      right: 3.8cqw;
      width: 6.5cqw;
      height: 6.5cqw;
      color: #ededed;
    }

    .liuyue-content {
      min-height: 0;
      flex: 1 0 auto;
      overflow: visible;
      background: var(--paper);
    }

    .liuyue-notebooks {
      display: grid;
      height: 26.7cqw;
      grid-template-columns: 1.06fr 1fr 1fr 1fr;
      gap: 2.8cqw;
      margin: 3.5cqw 3.6cqw 0;
    }

    .liuyue-notebook {
      position: relative;
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 2.2cqw;
      background: #fff;
      box-shadow: 0 2px 7px rgba(0,0,0,.11);
    }

    .liuyue-new-notebook { gap: 1cqw; }

    .liuyue-new-plus {
      display: grid;
      width: 7cqw;
      height: 7cqw;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: #59ad36;
      box-shadow: inset 0 -1px 2px rgba(0,0,0,.15), 0 1px 2px rgba(0,0,0,.12);
      font-size: 4.5cqw;
      font-weight: 600;
      line-height: 1;
    }

    .liuyue-new-label {
      color: #999;
      font-size: 3.5cqw;
      font-weight: 700;
      line-height: 1.3;
      text-align: center;
    }

    .liuyue-watermark { color: #e7e7e9; }
    .liuyue-watermark strong { font-size: 7.4cqw; font-weight: 750; letter-spacing: 0; }
    .liuyue-watermark::before, .liuyue-watermark::after { position: absolute; content: ""; pointer-events: none; }
    .liuyue-watermark::before {
      top: 10%; left: 12%; width: 72%; height: 68%;
      border: 1px solid rgba(222,222,226,.35);
      border-radius: 48% 52% 45% 55%;
      transform: rotate(-18deg);
    }
    .liuyue-watermark::after {
      top: 18%; right: 12%; width: 9cqw; height: 5cqw;
      border: 1px solid rgba(222,222,226,.45);
      border-radius: 50%;
      box-shadow: -24cqw 14cqw 0 -1px rgba(222,222,226,.45), -8cqw 31cqw 0 -1px rgba(222,222,226,.4);
    }

    .liuyue-qa-card {
      position: relative;
      height: 48.6cqw;
      margin: 3.3cqw 1.3cqw 0;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 1px 5px rgba(0,0,0,.08);
    }

    .liuyue-qa-titlebar {
      display: flex;
      height: 11.5cqw;
      align-items: center;
      justify-content: space-between;
      padding: 0 3.4cqw;
      background: #fcfcfc;
    }

    .liuyue-qa-title { font-size: 5.2cqw; font-weight: 800; line-height: 1; }
    .liuyue-progress { color: #b7b7b7; font-size: 3.5cqw; font-weight: 700; }

    .liuyue-interests {
      display: flex;
      height: 23.3cqw;
      align-items: flex-start;
      gap: 4cqw;
      padding: 2.7cqw 0 0 4.5cqw;
    }

    .liuyue-interest {
      display: grid;
      width: 10cqw;
      height: 10cqw;
      flex: 0 0 10cqw;
      place-items: center;
      border-radius: 50%;
      box-shadow: inset 0 -1px 1px rgba(0,0,0,.13);
    }

    .liuyue-interest svg { width: 7.3cqw; height: 7.3cqw; }
    .liuyue-interest.liuyue-movie { color: #143d3b; background: #5fb5b1; }
    .liuyue-interest.liuyue-book { color: #f7d96b; background: #7f8ee0; }
    .liuyue-interest.liuyue-music { color: #201714; background: #ed9b57; }
    .liuyue-interest.liuyue-food { color: #3e5730; background: #a8d866; }

    .liuyue-match-copy {
      position: absolute;
      bottom: 19.5cqw;
      left: 3.4cqw;
      color: #929292;
      font-size: 3.2cqw;
      line-height: 1;
    }

    .liuyue-answer-button {
      position: absolute;
      top: 21.6cqw;
      right: 4cqw;
      display: flex;
      width: 24.2cqw;
      height: 9.2cqw;
      align-items: center;
      justify-content: center;
      gap: 1cqw;
      border: 0;
      border-radius: 99px;
      color: #fff;
      background: #f16620;
      box-shadow: 0 2px 3px rgba(0,0,0,.17), inset 0 -2px 2px rgba(172,64,17,.3);
      font-size: 3.6cqw;
      font-weight: 750;
      white-space: nowrap;
    }

    .liuyue-answer-button svg { width: 4cqw; height: 4cqw; }

    .liuyue-mascot {
      position: absolute;
      top: 11.5cqw;
      right: 6cqw;
      width: 22cqw;
      height: 15cqw;
    }

    .liuyue-same-hobby {
      display: flex;
      height: 14.1cqw;
      align-items: center;
      gap: 3cqw;
      padding: 0 3.5cqw;
      border-top: 1px solid #f0f0f0;
    }

    .liuyue-satellite { width: 9cqw; height: 9cqw; flex: 0 0 9cqw; }
    .liuyue-same-label { flex: 1; font-size: 3.6cqw; font-weight: 750; }
    .liuyue-row-chevron { width: 5cqw; height: 5cqw; color: #c9c9c9; }

    .liuyue-friends-card {
      height: 51.3cqw;
      margin: 1.2cqw 1.3cqw 0;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 1px 5px rgba(0,0,0,.08);
    }

    .liuyue-subheading {
      display: flex;
      height: 5.6cqw;
      align-items: center;
      padding: 0 3.4cqw;
      color: #aaa;
      background: #fcfcfc;
      font-size: 3.1cqw;
    }

    .liuyue-friend-row {
      display: flex;
      height: 10.8cqw;
      align-items: center;
      gap: 3cqw;
      padding: 0 3.4cqw;
      border-bottom: 1px solid #f0f0f0;
    }

    .liuyue-friend-icon { width: 10cqw; height: 10cqw; flex: 0 0 10cqw; }
    .liuyue-friend-title { flex: 1; font-size: 3.6cqw; font-weight: 750; }

    .liuyue-invite-title {
      display: flex;
      height: 5.6cqw;
      align-items: center;
      padding: 0 3.4cqw;
      color: #aaa;
      background: #fcfcfc;
      font-size: 3.1cqw;
    }

    .liuyue-invite-options {
      display: flex;
      height: 27.4cqw;
      align-items: flex-start;
      justify-content: space-around;
      padding-top: 2.8cqw;
    }

    .liuyue-invite-option {
      display: flex;
      width: 36cqw;
      flex-direction: column;
      align-items: center;
      gap: 2.8cqw;
      color: #777;
      font-size: 3.4cqw;
      font-weight: 650;
    }

    .liuyue-invite-icon {
      display: grid;
      width: 15.6cqw;
      height: 15.6cqw;
      place-items: center;
      border-radius: 50%;
      box-shadow: inset 0 -2px 2px rgba(0,0,0,.13), 0 1px 3px rgba(0,0,0,.1);
    }

    .liuyue-invite-icon svg { width: 10.5cqw; height: 10.5cqw; }
    .liuyue-email .liuyue-invite-icon { background: #67b7de; }
    .liuyue-wechat .liuyue-invite-icon { background: #58bf68; }

    .liuyue-bottom-nav {
      position: relative;
      z-index: 3;
      display: flex;
      height: calc(14cqw + var(--safe-bottom));
      min-height: 0;
      flex: 0 0 calc(14cqw + var(--safe-bottom));
      align-items: center;
      justify-content: space-around;
      padding: 0 0 var(--safe-bottom);
      background: #f7f7f7;
      box-shadow: 0 -2px 10px rgba(0,0,0,.05);
    }

    .liuyue-nav-item {
      display: grid;
      width: 12cqw;
      height: 12cqw;
      place-items: center;
      padding: 0;
      border: 0;
      color: #999;
      background: transparent;
    }

    .liuyue-nav-item svg { width: 8cqw; height: 8cqw; }
    .liuyue-nav-item.liuyue-active { color: #8bb4ed; }
    .liuyue-nav-item.liuyue-publish {
      width: 18cqw;
      height: 10cqw;
      border-radius: 99px;
      background: #fff;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,.1));
    }
    .liuyue-nav-item.liuyue-publish svg { width: 7cqw; height: 7cqw; }
    .liuyue-nav-item.liuyue-active::after {
      position: absolute;
      top: 10cqw;
      width: 2cqw;
      height: 2cqw;
      border-radius: 50%;
      background: #74a2eb;
      content: "";
    }

    .liuyue-nav-avatar {
      width: 7cqw;
      height: 7cqw;
      border: 1px solid #fff;
      border-radius: 50%;
      object-fit: cover;
    }

    /* iCity 三页互相跳转导航 */
    .ly_icity-nav {
      position: fixed;
      top: 10px;
      left: 50%;
      z-index: 99;
      display: flex;
      gap: 6px;
      padding: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .9);
      box-shadow: 0 6px 18px rgba(0, 0, 0, .12);
      font-size: 12px;
      transform: translateX(-50%);
    }

    .ly_icity-nav a {
      padding: 4px 11px;
      border-radius: 999px;
      color: #3b4a5a;
      text-decoration: none;
      font-weight: 700;
    }

    .ly_icity-nav a:hover { background: #e8eef7; }

    .ly_icity-nav a.ly_icity-current {
      color: #fff;
      background: #8bb4ed;
    }

  </style>
</head>
