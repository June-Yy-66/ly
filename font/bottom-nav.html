<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>底部导航栏</title>
  <!-- 标准 iconfont 在线引用；本页内嵌 SVG 符号作为可直接运行的图标定义。 -->
  <script src="https://at.alicdn.com/t/c/font_5231925_850t2obw1nj.js"></script>
  <style>
    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      display: flex;
      min-height: 100vh;
      margin: 0;
      align-items: flex-end;
      justify-content: center;
      background: #f0eef0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    .bottom-nav {
      position: fixed;
      z-index: 10;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      width: min(100%, 430px);
      height: calc(68px + env(safe-area-inset-bottom, 0px));
      margin: 0 auto;
      align-items: center;
      justify-content: space-evenly;
      padding: 0 8px env(safe-area-inset-bottom, 0px);
      background: #f5f5f5;
      box-shadow: 0 -2px 12px rgba(0, 0, 0, .04);
    }

    .nav-item {
      display: grid;
      min-width: 0;
      flex: 1;
      height: 48px;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 28px;
      color: #929292;
      background: transparent;
      cursor: pointer;
    }

    .nav-icon {
      display: block;
      width: 30px;
      height: 30px;
    }

    .nav-item-active {
      height: 54px;
      color: #78a2d9;
      background: #fff;
      box-shadow: 0 3px 10px rgba(0, 0, 0, .08);
    }

    .nav-item-active .nav-icon {
      width: 40px;
      height: 40px;
    }

    .nav-avatar { width: 34px; height: 34px; }

    @media (max-width: 520px) {
      .bottom-nav { height: calc(64px + env(safe-area-inset-bottom, 0px)); }
      .nav-item { height: 46px; }
      .nav-icon { width: 28px; height: 28px; }
      .nav-item-active { height: 52px; }
      .nav-item-active .nav-icon { width: 38px; height: 38px; }
      .nav-avatar { width: 32px; height: 32px; }
    }
  </style>
</head>
<body>
  <!-- 学号姓名：liuyue24002120220 -->
  <svg aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
    <symbol id="icon-shu" viewBox="0 0 48 48">
      <path fill="currentColor" d="M12 6h29L28 37H4L12 6Zm-5 34h26l-2.5 4H4l3-4Z"/>
    </symbol>
    <symbol id="icon-diqiu" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="20" fill="none" stroke="currentColor" stroke-width="3.5"/>
      <path fill="currentColor" d="m8 15 7-5 5 2 1 4-4 3-1 5-5-1-4-4 1-4Zm14-9 5 2 2 4-4 2-4-3 1-5Zm11 4 7 4 3 7-4 4-4-3-2-6 2-6ZM20 24l6-3 7 3 2 6-4 2-2 8-5 2-3-7-5-4 4-7Z"/>
    </symbol>
    <symbol id="icon-gangbigongju" viewBox="0 0 48 48">
      <path fill="currentColor" d="m7 32 21-22 12 12-21 22-12 2 0-14Zm23-24 4-4 12 12-4 4-12-12Z"/>
      <circle cx="24" cy="25" r="4" fill="#fff"/>
    </symbol>
    <symbol id="icon-xiaoxi" viewBox="0 0 48 48">
      <path fill="currentColor" d="M24 5C13 5 5 12 5 22c0 5 3 10 8 13l-2 9 10-5h3c11 0 19-7 19-17S35 5 24 5Z"/>
      <circle cx="17" cy="22" r="2" fill="#fff"/><circle cx="24" cy="22" r="2" fill="#fff"/><circle cx="31" cy="22" r="2" fill="#fff"/>
      <path d="M15 28q9 6 18 0" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="2"/>
    </symbol>
    <symbol id="icon-yonghu" viewBox="0 0 48 48">
      <circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <circle cx="24" cy="18" r="7" fill="currentColor"/>
      <path fill="currentColor" d="M10 38c1-8 6-12 14-12s13 4 14 12a19 19 0 0 1-28 0Z"/>
    </symbol>
  </svg>

  <nav class="bottom-nav" aria-label="底部导航">
    <button class="nav-item" type="button" aria-label="书本">
      <svg class="nav-icon" aria-hidden="true"><use href="#icon-shu"></use></svg>
    </button>
    <button class="nav-item" type="button" aria-label="地球">
      <svg class="nav-icon" aria-hidden="true"><use href="#icon-diqiu"></use></svg>
    </button>
    <button class="nav-item nav-item-active" type="button" aria-label="画笔">
      <svg class="nav-icon" aria-hidden="true"><use href="#icon-gangbigongju"></use></svg>
    </button>
    <button class="nav-item" type="button" aria-label="消息">
      <svg class="nav-icon" aria-hidden="true"><use href="#icon-xiaoxi"></use></svg>
    </button>
    <button class="nav-item" type="button" aria-label="用户头像">
      <svg class="nav-icon nav-avatar" aria-hidden="true"><use href="#icon-yonghu"></use></svg>
    </button>
  </nav>
</body>
</html>
