<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#292929">
  <title>世界 · World</title>
  <script src="https://at.alicdn.com/t/c/font_5231925_850t2obw1nj.js"></script>
  <style>
    :root {
      color-scheme: light;
      --charcoal: #292929;
      --feed-width: 384px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: #000;
      color: #111;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }

    .liuyue-phone {
      position: relative;
      display: flex;
      width: min(100%, var(--feed-width));
      height: 100dvh;
      min-height: 0;
      margin: 0 auto;
      flex-direction: column;
      overflow: hidden;
      container-type: inline-size;
      background: #f5f5f5;
      box-shadow: 0 0 0 1px rgba(255,255,255,.08);
    }

    .liuyue-top-area {
      z-index: 2;
      flex: 0 0 202px;
      color: #f7f7f7;
      background: var(--charcoal);
    }

    .liuyue-status-bar {
      position: relative;
      display: flex;
      height: 112px;
      align-items: flex-start;
      justify-content: space-between;
      padding: 39px 7.8% 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: .1px;
    }

    .liuyue-status-time { line-height: 1; }

    .liuyue-dynamic-island {
      position: absolute;
      top: 22px;
      left: 50%;
      display: flex;
      width: 352px;
      max-width: 48%;
      height: 72px;
      align-items: center;
      padding-left: 18px;
      border-radius: 44px;
      background: #030303;
      transform: translateX(-50%);
    }

    .liuyue-status-mark { width: 47px; height: 47px; color: #76f58e; }

    .liuyue-status-right {
      display: flex;
      align-items: center;
      gap: 9px;
      line-height: 1;
    }

    .liuyue-signal { width: 39px; height: 27px; }
    .liuyue-network { font-size: 23px; font-weight: 600; }
    .liuyue-battery { width: 51px; height: 27px; }

    .liuyue-top-tabs {
      display: flex;
      width: min(530px, calc(100% - 32px));
      height: 63px;
      margin: 15px auto 0;
      align-items: center;
      padding: 4px;
      border: 1px solid #1d1d1d;
      border-radius: 8px;
      background: #202020;
      box-shadow: 0 0 0 2px rgba(0,0,0,.24), inset 0 1px 3px rgba(255,255,255,.04);
    }

    .liuyue-top-tabs button {
      display: flex;
      height: 53px;
      min-width: 0;
      flex: 1;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 8px;
      border: 0;
      border-right: 1px solid #151515;
      border-radius: 5px;
      color: #eee;
      background: transparent;
      font-size: 27px;
      font-weight: 750;
      white-space: nowrap;
    }

    .liuyue-top-tabs button:last-child { border-right: 0; }
    .liuyue-top-tabs button[aria-selected="true"] { background: #414141; box-shadow: inset 0 1px 2px rgba(255,255,255,.08); }
    .liuyue-heart-tab { font-size: 34px !important; }

    .liuyue-section-bar {
      z-index: 1;
      display: flex;
      height: 77px;
      flex: 0 0 77px;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      color: #747474;
      background: #f5f5f5;
      box-shadow: 0 1px 5px rgba(0,0,0,.08);
    }

    .liuyue-section-title {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 25px;
      font-weight: 700;
    }

    .liuyue-menu-icon { width: 30px; height: 30px; color: #aaa; }
    .liuyue-chevron { width: 30px; height: 30px; color: #aaa; }

    .liuyue-feed {
      min-height: 0;
      flex: 1;
      overflow: hidden;
      overscroll-behavior: contain;
      scrollbar-width: none;
      background: #f4f4f4;
    }

    .liuyue-feed::-webkit-scrollbar { display: none; }

    .liuyue-post {
      background: #fff;
      border-bottom: 1px solid #e6e6e6;
    }

    .liuyue-post-author {
      display: flex;
      height: 94px;
      align-items: center;
      gap: 16px;
      padding: 0 35px;
      background: #fff;
    }

    .liuyue-avatar {
      width: 56px;
      height: 56px;
      flex: 0 0 56px;
      overflow: hidden;
      border-radius: 50%;
      background: #d1d1d1;
      object-fit: cover;
    }

    .liuyue-author-copy { min-width: 0; }
    .liuyue-username { overflow: hidden; font-size: 24px; font-weight: 760; line-height: 1.2; text-overflow: ellipsis; white-space: nowrap; }
    .liuyue-handle { margin-top: 3px; color: #aaa; font-size: 20px; line-height: 1.15; }

    .liuyue-main-photo {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 768 / 800;
      background: #aaa;
      object-fit: fill;
      object-position: center 48%;
      filter: grayscale(1) contrast(.98);
    }

    .liuyue-post-actions {
      display: flex;
      height: 78px;
      align-items: center;
      justify-content: flex-end;
      gap: 27px;
      padding: 0 35px;
      color: #c9c9c9;
      background: #fff;
    }

    .liuyue-action-icon { width: 29px; height: 29px; flex: 0 0 auto; }
    .liuyue-posted-time { display: flex; align-items: center; gap: 8px; color: #c9c9c9; font-size: 20px; white-space: nowrap; }
    .liuyue-more { width: 22px; height: 28px; margin-left: 2px; color: #c9c9c9; }

    .liuyue-post-divider { height: 1px; margin: 0 25px; background: #eee; }
    .liuyue-second-post .liuyue-post-author { height: 93px; }

    .liuyue-blur-preview {
      display: block;
      width: 100%;
      height: 220px;
      object-fit: cover;
      object-position: center 44%;
      filter: blur(1.5px) saturate(.55);
      transform: scale(1.015);
    }

    .liuyue-bottom-nav {
      z-index: 3;
      display: flex;
      height: calc(112px + var(--safe-bottom));
      min-height: 112px;
      flex: 0 0 calc(112px + var(--safe-bottom));
      align-items: center;
      justify-content: space-evenly;
      padding: 0 14px var(--safe-bottom);
      background: #f5f5f5;
      box-shadow: 0 -2px 10px rgba(0,0,0,.07);
    }

    .liuyue-nav-item {
      display: grid;
      min-width: 0;
      flex: 1;
      height: 78px;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 36px;
      color: #9c9c9c;
      background: transparent;
    }

    .liuyue-nav-icon { width: 40px; height: 40px; }
    .liuyue-nav-item.liuyue-active {
      position: relative;
      color: #78a2d9;
      background: #fff;
      box-shadow: 0 5px 16px rgba(0,0,0,.08);
    }

    .liuyue-nav-item.liuyue-active .liuyue-nav-icon {
      width: 52px;
      height: 52px;
    }

    .liuyue-active-dot {
      position: absolute;
      bottom: -2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #76a2e8;
      box-shadow: 0 1px 3px rgba(0,0,0,.2);
    }

    .liuyue-nav-avatar { width: 46px; height: 46px; }

    @container (max-width: 520px) {
      .liuyue-top-area { flex-basis: 26.3cqw; min-height: 0; }
      .liuyue-status-bar { height: 14.6cqw; min-height: 0; padding: 5.7cqw 8.5% 0; font-size: 3.7cqw; }
      .liuyue-dynamic-island { top: 2.9cqw; width: 46cqw; height: 9.4cqw; min-height: 0; padding-left: 2.3cqw; }
      .liuyue-status-mark { width: 6.1cqw; height: 6.1cqw; min-width: 0; min-height: 0; }
      .liuyue-signal { width: 5.1cqw; height: 3.6cqw; min-width: 0; min-height: 0; }
      .liuyue-network { font-size: 3cqw; }
      .liuyue-battery { width: 6.7cqw; height: 3.6cqw; min-width: 0; min-height: 0; }
      .liuyue-status-right { gap: 1.1cqw; }
      .liuyue-top-tabs { height: 8.2cqw; min-height: 0; margin-top: 2cqw; }
      .liuyue-top-tabs button { height: calc(100% - 6px); font-size: 3.6cqw; }
      .liuyue-heart-tab { font-size: 4.4cqw !important; }
      .liuyue-section-bar { height: 10cqw; min-height: 0; flex-basis: 10cqw; padding: 0 3%; }
      .liuyue-section-title { gap: 2cqw; font-size: 3.3cqw; }
      .liuyue-menu-icon, .liuyue-chevron { width: 4cqw; height: 4cqw; min-width: 0; min-height: 0; }
      .liuyue-post-author { height: 12.2cqw; min-height: 0; gap: 2.1cqw; padding: 0 4.6%; }
      .liuyue-avatar { width: 7.3cqw; height: 7.3cqw; flex-basis: 7.3cqw; min-width: 0; min-height: 0; }
      .liuyue-username { font-size: 3.2cqw; }
      .liuyue-handle { margin-top: 1px; font-size: 2.6cqw; }
      .liuyue-main-photo { height: auto; aspect-ratio: 1 / 1; }
      .liuyue-post-actions { height: 10.2cqw; min-height: 0; gap: 3.4cqw; padding: 0 4.5%; }
      .liuyue-action-icon { width: 3.8cqw; height: 3.8cqw; min-width: 0; min-height: 0; }
      .liuyue-posted-time { gap: 1cqw; font-size: 2.6cqw; }
      .liuyue-more { width: 3cqw; height: 4cqw; }
      .liuyue-post-divider { margin: 0 3.2%; }
      .liuyue-second-post .liuyue-post-author { height: 12.1cqw; min-height: 0; }
      .liuyue-blur-preview { height: 26cqw; min-height: 0; }
      .liuyue-bottom-nav { height: calc(17cqw + var(--safe-bottom)); min-height: 0; flex-basis: calc(17cqw + var(--safe-bottom)); align-items: center; padding: 0 2.5% var(--safe-bottom); }
      .liuyue-nav-item { width: auto; height: 10.2cqw; min-height: 0; }
      .liuyue-nav-icon { width: 6cqw; height: 6cqw; min-width: 0; min-height: 0; }
      .liuyue-nav-item.liuyue-active .liuyue-nav-icon { width: 8.2cqw; height: 8.2cqw; min-width: 0; min-height: 0; }
      .liuyue-active-dot { bottom: -1px; width: 1.8cqw; height: 1.8cqw; min-width: 0; min-height: 0; }
      .liuyue-nav-avatar { width: 7cqw; height: 7cqw; min-width: 0; min-height: 0; }
    }
    /* iCity 三页互相跳转导航 */
    .ly_icity-nav {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 99;
      display: flex;
      gap: 6px;
      padding: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .84);
      box-shadow: 0 6px 18px rgba(0, 0, 0, .14);
      font-size: 12px;
    }

    .ly_icity-nav a {
      padding: 4px 11px;
      border-radius: 999px;
      color: #3b4a5a;
      text-decoration: none;
      font-weight: 700;
    }

    .ly_icity-nav a:hover { background: #e8eef7; }

    .ly_icity-nav a.ly_icity-current {
      color: #fff;
      background: #8bb4ed;
    }
  </style>
</head>
<body>

  <main class="liuyue-phone" aria-label="世界动态">
    <header class="liuyue-top-area">
      <div class="liuyue-status-bar" aria-label="14:03，5G，电量77%">
        <span class="liuyue-status-time">14:03</span>
        <div class="liuyue-dynamic-island" aria-hidden="true">

          </svg>
        </div>
      </div>
      <nav class="liuyue-top-tabs" aria-label="动态分类">
        <button type="button" aria-selected="true">世界</button>
        <button type="button" aria-selected="false">朋友</button>

    </header>

    <div class="liuyue-section-bar">
      <div class="liuyue-section-title">

      <svg class="liuyue-chevron" viewBox="0 0 30 30" fill="none" aria-hidden="true"><path d="m4 10 11 10 11-10" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <section class="liuyue-feed" aria-label="帖子动态">
