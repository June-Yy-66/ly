<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#292929">
  <title>程序设置</title>
  <style>
    :root {
      color-scheme: light;
      --liuyue-ink: #111;
      --liuyue-muted: #aaa;
      --liuyue-paper: #f2f0f1;
      --liuyue-line: #e8e7e7;
      --liuyue-safe-top: env(safe-area-inset-top, 0px);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { overflow-x: hidden; color: var(--liuyue-ink); background: var(--liuyue-paper); -webkit-font-smoothing: antialiased; }
    button { color: inherit; font: inherit; }

    .liuyue-page {
      width: min(100vw, 384px);
      min-height: 100dvh;
      margin: 0 auto;
      overflow: hidden;
      background: var(--liuyue-paper);
      container-type: inline-size;
    }

    .liuyue-header {
      height: 26.5cqw;
      color: #f5f5f5;
      background: #292929;
    }

    .liuyue-statusbar {
      position: relative;
      display: flex;
      height: 13cqw;
      align-items: center;
      justify-content: space-between;
      padding: var(--liuyue-safe-top) 8.5% 0;
      font-size: 3.7cqw;
      font-weight: 700;
      line-height: 1;
    }

    .liuyue-island {
      position: absolute;
      top: calc(var(--liuyue-safe-top) + 2.9cqw);
      left: 50%;
      display: flex;
      width: 46cqw;
      height: 9.4cqw;
      align-items: center;
      padding-left: 2.3cqw;
      border-radius: 99px;
      background: #030303;
      transform: translateX(-50%);
    }

    .liuyue-island-mark { width: 6.1cqw; height: 6.1cqw; color: #76f58e; }
    .liuyue-status-right { display: flex; align-items: center; gap: 1.1cqw; }
    .liuyue-signal { width: 5.1cqw; height: 3.6cqw; }
    .liuyue-network { font-size: 3cqw; font-weight: 600; }
    .liuyue-battery { width: 6.7cqw; height: 3.6cqw; }

    .liuyue-navrow {
      position: relative;
      display: flex;
      height: 13.5cqw;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #171717;
    }

    .liuyue-back {
      position: absolute;
      left: 3.5cqw;
      display: flex;
      align-items: center;
      gap: 1cqw;
      padding: 0;
      border: 0;
      color: #aaa;
      background: transparent;
      font-size: 4.2cqw;
    }

    .liuyue-back svg { width: 7cqw; height: 7cqw; color: #eee; }
    .liuyue-title { margin: 0; color: #f4f4f4; font-size: 4.1cqw; font-weight: 750; }
    .liuyue-done { position: absolute; right: 4cqw; color: #a8a8a8; font-size: 4.2cqw; }

    .liuyue-icons-panel { padding-top: 2.3cqw; background: #fff; }

    .liuyue-section-heading {
      display: flex;
      height: 13cqw;
      align-items: center;
      gap: 4.5cqw;
      padding: 0 5.5cqw;
      color: #777;
    }

    .liuyue-small-app {
      width: 12cqw;
      height: 12cqw;
      flex: 0 0 12cqw;
      border: 1px solid #e8e8e8;
      border-radius: 2cqw;
      background: #fff;
    }

    .liuyue-section-heading strong { font-size: 3.8cqw; font-weight: 750; white-space: nowrap; }

    .liuyue-pro {
      display: inline-flex;
      min-width: 12.5cqw;
      height: 7cqw;
      align-items: center;
      justify-content: center;
      padding: 0 2cqw;
      border-radius: 99px;
      color: #fff;
      background: #e87543;
      font-size: 3.3cqw;
      font-weight: 750;
      line-height: 1;
    }

    .liuyue-icon-scroller {
      display: flex;
      gap: 3cqw;
      overflow-x: auto;
      padding: 1cqw 2.6cqw 4cqw;
      scrollbar-width: none;
    }

    .liuyue-icon-scroller::-webkit-scrollbar { display: none; }

    .liuyue-icon-option {
      display: flex;
      width: 19.5cqw;
      flex: 0 0 19.5cqw;
      flex-direction: column;
      align-items: center;
      gap: 2.2cqw;
      color: #777;
      font-size: 3.2cqw;
      line-height: 1.1;
      text-align: center;
    }

    .liuyue-app-art {
      display: block;
      width: 19.5cqw;
      height: 19.5cqw;
      overflow: hidden;
      border: 1px solid #e5e5e5;
      border-radius: 8cqw;
      background: #fff;
    }

    .liuyue-icon-option.liuyue-selected .liuyue-app-art {
      border: 2px solid #70d874;
      box-shadow: 0 0 0 1px rgba(94,205,103,.12);
    }

    .liuyue-profile {
      display: flex;
      height: 17cqw;
      align-items: center;
      gap: 3cqw;
      margin-top: 1cqw;
      padding: 0 5cqw 0 5cqw;
      border-top: 1px solid var(--liuyue-line);
      border-bottom: 1px solid var(--liuyue-line);
      background: #fff;
    }

    .liuyue-profile-avatar {
      width: 11cqw;
      height: 11cqw;
      flex: 0 0 11cqw;
      border-radius: 50%;
      object-fit: cover;
    }

    .liuyue-profile-copy { min-width: 0; flex: 1; }
    .liuyue-nickname { font-size: 3.7cqw; font-weight: 750; line-height: 1.25; }
    .liuyue-account { margin-top: 1cqw; color: #aaa; font-size: 3cqw; font-weight: 600; }
    .liuyue-profile-action { display: flex; align-items: center; gap: 2cqw; color: #aaa; font-size: 3.4cqw; white-space: nowrap; }
    .liuyue-chevron { width: 5cqw; height: 5cqw; color: #d0d0d0; flex: 0 0 auto; }

    .liuyue-settings-group { margin-top: 0; background: #fff; }
    .liuyue-settings-group + .liuyue-settings-group { margin-top: 1.5cqw; border-top: 1px solid var(--liuyue-line); }

    .liuyue-setting-row {
      display: flex;
      min-height: 11.4cqw;
      align-items: center;
      gap: 2cqw;
      padding: 0 4cqw 0 5cqw;
      border-bottom: 1px solid var(--liuyue-line);
      background: #fff;
    }

    .liuyue-setting-name { min-width: 0; flex: 1; font-size: 3.7cqw; font-weight: 500; white-space: nowrap; }
    .liuyue-setting-side { display: flex; align-items: center; gap: 2cqw; color: #aaa; font-size: 3.7cqw; font-weight: 600; white-space: nowrap; }
    .liuyue-setting-side .liuyue-pro { min-width: 11cqw; height: 3.6cqw; padding: 0 1.6cqw; font-size: 3cqw; }
    .liuyue-setting-value { color: #416d93; }
    .liuyue-row-chevron { width: 5cqw; height: 5cqw; flex: 0 0 5cqw; color: #d0d0d0; }
    .liuyue-row-chevron path { stroke-width: 3.2; }

    /* iCity 三页互相跳转导航 */
    .ly_icity-nav {
      position: fixed;
      top: 10px;
      left: 50%;
      z-index: 99;
      display: flex;
      gap: 6px;
      padding: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .9);
      box-shadow: 0 6px 18px rgba(0, 0, 0, .12);
      font-size: 12px;
      transform: translateX(-50%);
    }

    .ly_icity-nav a {
      padding: 4px 11px;
      border-radius: 999px;
      color: #3b4a5a;
      text-decoration: none;
      font-weight: 700;
    }

    .ly_icity-nav a:hover { background: #e8eef7; }

    .ly_icity-nav a.ly_icity-current {
      color: #fff;
      background: #8bb4ed;
    }

  </style>
</head>
<body>
  <nav class="ly_icity-nav" aria-label="iCity 页面导航">
    <a href="index1.html">世界</a>
    <a href="font/contact1.html">通讯录</a>
    <a class="ly_icity-current" href="setting1.html">设置</a>

  <main class="liuyue-page" aria-label="程序设置">

          <svg class="liuyue-battery" viewBox="0 0 52 28" aria-hidden="true"><rect x="1" y="2" width="45" height="24" rx="5" fill="none" stroke="#f4f4f4" stroke-width="2"/><path d="M48 9h3v10h-3" fill="#f4f4f4"/><rect x="4" y="5" width="32" height="18" rx="2.5" fill="#f4f4f4"/><text x="10" y="19" fill="#292929" font-family="Arial,sans-serif" font-size="15" font-weight="700">77</text></svg>

      </div>
      <div class="liuyue-navrow">
        <button class="liuyue-back" type="button" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m15 4-8 8 8 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>返回</span></button>

    <section class="liuyue-icons-panel" aria-label="更换主屏幕图标">

          <span>猫龙™</span>

        <div class="liuyue-icon-option">
          <svg class="liuyue-app-art" viewBox="0 0 128 128" aria-label="独角兽图标"><rect x="1" y="1" width="126" height="126" rx="25" fill="#fff"/><text x="64" y="45" text-anchor="middle" fill="#171717" font-size="34" font-weight="800">icity</text><path d="m45 80 19-48 18 48" fill="#c7eaff" stroke="#caa8da" stroke-width="4"/><path d="M27 101c0-24 15-39 37-39s37 15 37 39c-18 13-56 13-74 0Z" fill="#f3a7d0"/><ellipse cx="64" cy="96" rx="28" ry="18" fill="#ffd75d"/><path d="M38 77q-12-2-10 15m62-15q12-2 10 15" fill="none" stroke="#ef8fbd" stroke-width="9" stroke-linecap="round"/><circle cx="52" cy="84" r="3" fill="#fff"/><circle cx="76" cy="84" r="3" fill="#fff"/></svg>
          <span>独角兽</span>
        </div>
        <div class="liuyue-icon-option">
          <svg class="liuyue-app-art" viewBox="0 0 128 128" aria-label="拉斐尔图标"><rect x="1" y="1" width="126" height="126" rx="25" fill="#fff"/><text x="64" y="45" text-anchor="middle" fill="#171717" font-size="34" font-weight="800">icity</text><path d="M22 79 43 58l12 20-7 29H26Zm84 0L85 58 73 78l7 29h22Z" fill="#bde8ff" stroke="#9fcde8" stroke-width="3"/><ellipse cx="64" cy="89" rx="31" ry="27" fill="#f4c73e"/><ellipse cx="64" cy="65" rx="25" ry="9" fill="#fff" stroke="#79c9ed" stroke-width="5"/><ellipse cx="64" cy="90" rx="24" ry="17" fill="#ffdf69"/><circle cx="55" cy="83" r="3" fill="#fff"/><circle cx="73" cy="83" r="3" fill="#fff"/></svg>

          <span>路西法</span>
        </div>
        <div class="liuyue-icon-option">

    <section class="liuyue-profile" aria-label="个人资料">
      <img class="liuyue-profile-avatar" src="assets/avatar-moriendo.jpg" alt="小小六月头像">
      <div class="liuyue-profile-copy"><div class="liuyue-nickname">小小六月</div><div class="liuyue-account">xiaoxiaoliuyue</div></div>
      <div class="liuyue-profile-action">修改资料<svg class="liuyue-chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m8 4 8 8-8 8" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    </section>

    <div class="liuyue-settings-group" aria-label="账户设置">

    <div class="liuyue-settings-group" aria-label="主页与日记设置">

      <div class="liuyue-setting-row"><span class="liuyue-setting-name">我的封存日记</span><svg class="liuyue-row-chevron" viewBox="0 0 24 24" fill="none"><path d="m8 4 8 8-8 8" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="liuyue-setting-row"><span class="liuyue-setting-name">我的日记打印本</span><span class="liuyue-setting-side"><span class="liuyue-pro">Pro</span></span><svg class="liuyue-row-chevron" viewBox="0 0 24 24" fill="none"><path d="m8 4 8 8-8 8" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
