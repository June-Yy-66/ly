<!DOCTYPE html>
<!--
  作者：刘悦
  学号：24002120220
  建立时间：2026-11-18
  使用大模型：GLM-5.3-FlashX
  功能名称：移动端图片查看器（任务三，在任务二滑动卡片基础上完成）——左右滑动切换接口卡片，当前图片支持双指缩放（1~4 倍）、单指拖动、双击 1x/2x 切换
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>移动端手势缩放 · 图片查看器</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:#f6f8fc;min-height:100vh;padding:40px 18px 60px}
  /* 页面大标题：红色字体 */
  .ly_title{text-align:center;font-size:26px;color:red;letter-spacing:2px;margin-bottom:24px}
  /* 页面其余文字统一蓝色 */
  body,.ly_card,.ly_counter,.ly_scalebox,.ly_tip,.ly_back a{color:blue}

  /* 手势作用容器：裁切溢出、禁用浏览器默认触摸行为、禁止选中文字（任务三要求 1） */
  .ly_viewer{
    max-width:420px;margin:0 auto;
    overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  }
  /* 美食卡片：上图下文结构，渐变背景兜底，切换时带 0.3s 滑入动画（任务二） */
  .ly_card{
    position:relative;height:340px;border-radius:18px;overflow:hidden;
    box-shadow:0 12px 30px rgba(31,41,55,.18);
    display:flex;flex-direction:column;background:linear-gradient(135deg,#5b7fbe,#89a7dc);
  }
  /* 卡片图片：接口返回 pic 字段渲染；以左上角为变换原点，方便按容器坐标计算缩放锚点 */
  .ly_pic{width:100%;height:195px;object-fit:cover;display:block;flex:none;transform-origin:0 0;will-change:transform;pointer-events:none}
  /* 双击切换时加 0.25s 过渡动画，捏合/拖动过程中不加（保证跟手） */
  .ly_pic.ly_transition{transition:transform .25s ease}
  /* 切换卡片时的 0.3s 过渡动画：两张方向各一组关键帧（任务二） */
  .ly_card.ly_anim-next{animation:ly_slide_next .3s ease}
  .ly_card.ly_anim-prev{animation:ly_slide_prev .3s ease}
  @keyframes ly_slide_next{from{transform:translateX(60px);opacity:0}to{transform:translateX(0);opacity:1}}
  @keyframes ly_slide_prev{from{transform:translateX(-60px);opacity:0}to{transform:translateX(0);opacity:1}}

  /* 卡片文字区：菜名 + 简介，占据图片以下剩余高度 */
  .ly_info{flex:1;padding:18px 20px 22px;background:linear-gradient(transparent,rgba(5,15,35,.55))}
  .ly_name{font-size:24px;font-weight:bold;letter-spacing:2px}
  .ly_desc{font-size:14px;line-height:1.9;margin-top:8px;opacity:.92}

  /* 底部状态区：张数指示 + 缩放倍数 + 边界提示 */
  .ly_status{max-width:420px;margin:18px auto 0;text-align:center}
  .ly_counter{font-size:15px;font-weight:bold}
  .ly_scalebox{font-size:13.5px;margin-top:6px}
  .ly_hint{font-size:13px;margin-top:8px;min-height:20px;opacity:0;transition:opacity .25s}
  .ly_hint.ly_show{opacity:1}

  /* 页面打开时的操作提示 */
  .ly_tip{text-align:center;font-size:13.5px;line-height:1.9;margin-top:22px}
  /* 返回首页链接 */
  .ly_back{text-align:center;margin-top:16px}
  .ly_back a{font-size:14.5px;font-weight:bold;text-decoration:none;border:1px solid #c7d8f8;background:#fff;border-radius:999px;padding:10px 26px;display:inline-block}
</style>
</head>
<body>

  <h1 class="ly_title">图片查看器 · 滑动切换 + 双指缩放</h1>

  <!-- 手势作用容器：外层滑动切卡，内层图片缩放 -->
  <div class="ly_viewer" id="ly_viewer">
    <div class="ly_card" id="ly_card">
      <img class="ly_pic" id="ly_pic" alt="">
      <div class="ly_info">
        <div class="ly_name" id="ly_name"></div>
        <div class="ly_desc" id="ly_desc"></div>
      </div>
    </div>
  </div>

  <div class="ly_status">
    <!-- 张数指示：第 X/4 张 -->
    <div class="ly_counter" id="ly_counter"></div>
    <!-- 缩放倍数实时指示 -->
    <div class="ly_scalebox" id="ly_scalebox">缩放 1.0x</div>
    <!-- 边界提示文字：已是第一张/最后一张时短暂显示 -->
    <div class="ly_hint" id="ly_hint"></div>
  </div>

  <!-- 页面打开时的提示文字（任务三要求 6），接口数据加载后更新操作说明 -->
  <p class="ly_tip" id="ly_tip">双指缩放请用手机打开<br>数据加载中……</p>
  <div class="ly_back"><a href="index.html">返回首页</a></div>

  /** 卡片数据列表：初始为本地默认图文（不依赖接口，手机直接打开也有图片），接口加载成功后覆盖为接口文字 */
  var ly_dishes = [
    { title: '天宫空间站', content: '中国自主建造的载人空间站，2022 年全面建成。' },
    { title: 'C919 大飞机', content: '我国首款自主研制的大型客机，2023 年投入商业运营。' },
    { title: '福建舰', content: '我国首艘弹射型航空母舰，2022 年下水。' },
    { title: '复兴号动车组', content: '时速 350 公里的中国标准动车组。' }
  ];
  /** 当前卡片索引（0 起） */
  var ly_index = 0;
  /** 滑动切换的横向位移阈值（px） */
  var ly_threshold = 40;
  /** 切卡冷却时间（ms）：防止快速连滑一次跳两张 */
  var ly_cooldown = 300;
  /** 冷却锁：true 期间忽略新的切卡请求 */
  var ly_lock = false;
  /** 当前缩放倍数（1～4） */
  var ly_scale = 1;
  /** 当前旋转角度（deg），双指旋转手势产生 */
  var ly_rot = 0;
  /** 当前图片平移量（px），配合 scale 实现缩放锚点与拖动 */
  var ly_tx = 0;
  var ly_ty = 0;
  /** 双指捏合的初始两指间距、初始倍数、初始两指角度与初始旋转角 */
  var ly_pinchDist = 0;
  var ly_pinchScale = 1;
  var ly_pinchAngle = 0;
  var ly_pinchRot = 0;
  /** 缩放锚点：双指中点在容器内的坐标，以及它对应的图片坐标（捏合过程中保持不动） */
  var ly_anchorX = 0;
  var ly_anchorY = 0;
  var ly_anchorImgX = 0;
  var ly_anchorImgY = 0;
  /** 单指拖动：起点坐标 + 拖动开始时的平移基准 */
  var ly_dragX = 0;
  var ly_dragY = 0;
  var ly_dragBaseX = 0;
  var ly_dragBaseY = 0;
  /** 滑动切卡：touchstart 起点坐标（1x 时用于判定左右滑） */
  var ly_swipeX = 0;
  var ly_swipeY = 0;
  /** 双击检测：上一次抬手的时间与坐标 */
  var ly_lastTapTime = 0;
  var ly_lastTapX = 0;
  var ly_lastTapY = 0;
  /** 双击过渡动画的定时器 */
  var ly_transTimer = null;
  /** 边界提示文字的定时器 */
  var ly_hintTimer = null;
  /** 缩放倍数上限/下限 */
  var ly_minScale = 1;
  var ly_maxScale = 4;

  /**
   * 渲染当前索引对应的菜品：更新图片、菜名、简介和张数指示文字
   */
  function ly_render() {
    if (ly_dishes.length === 0) { return; }
    var ly_dish = ly_dishes[ly_index];
    // 图片使用本地默认光影展图片，文字（菜名、简介）仍来自接口
    document.getElementById('ly_pic').src = ly_defaultPics[ly_index % ly_defaultPics.length];
    document.getElementById('ly_pic').alt = ly_dish.title;
    document.getElementById('ly_name').textContent = ly_dish.title;
    document.getElementById('ly_desc').textContent = ly_dish.content;
    document.getElementById('ly_counter').textContent = '第 ' + (ly_index + 1) + '/' + ly_dishes.length + ' 张';
  }

  /**
   * 从数据服务器获取卡片文字：成功后覆盖本地默认文字并重渲染；失败时保留默认图文（页面依然可用）
   */
  function ly_loadData() {
    fetch(ly_api + '/poems')
      .then(function (ly_res) { return ly_res.json(); })
      .then(function (ly_data) {
        ly_dishes = ly_data.poems;
        document.getElementById('ly_tip').textContent = '双指缩放请用手机打开 · 1x 时左右滑动切换卡片 · 放大后单指拖动 · 双击切换 1x/2x';
        ly_render();
        ly_apply();
      })
      .catch(function () {
        // 接口连不上（如手机未与电脑同网）：保留本地默认图文，仅提示接口未启动
        document.getElementById('ly_tip').textContent = '双指缩放请用手机打开 · 接口未连接，当前显示默认图文（启动 db 服务器后刷新可同步最新文案）';
      });
  }

  /**
   * 显示边界提示文字（已经是第一张/最后一张），1.5 秒后自动淡出
   * @param {string} ly_text - 提示内容
   */
  function ly_showHint(ly_text) {
    var ly_hint = document.getElementById('ly_hint');
    ly_hint.textContent = ly_text;
    ly_hint.classList.add('ly_show');
    clearTimeout(ly_hintTimer);
    ly_hintTimer = setTimeout(function () { ly_hint.classList.remove('ly_show'); }, 1500);
  }

  /**
   * 切换到指定索引的卡片：复位缩放状态、按滑动方向重放 0.3s 动画，冷却期内忽略，越界则提示
   * @param {number} ly_target - 目标索引（0 起）
   * @param {string} ly_dir - 滑动方向：'next' 左滑看下一张 / 'prev' 右滑看上一张
   */
  function ly_switchTo(ly_target, ly_dir) {
    // 冷却期内忽略请求，防止快速连滑一次跳两张
    if (ly_lock) { return; }
    if (ly_target < 0) { ly_showHint('已经是第一张'); return; }
    if (ly_target >= ly_dishes.length) { ly_showHint('已经是最后一张'); return; }
    // 上锁并安排 300ms 后解锁
    ly_lock = true;
    setTimeout(function () { ly_lock = false; }, ly_cooldown);
    // 切卡前把图片缩放和旋转复位到正常视角
    ly_scale = ly_minScale;
    ly_rot = 0;
    ly_tx = 0;
    ly_ty = 0;
    ly_index = ly_target;
    ly_render();
    ly_apply();
    // 按滑动方向重放动画：先移除旧动画类，强制回流后再加新类，保证连续切换也能重新播放
    var ly_card = document.getElementById('ly_card');
    ly_card.classList.remove('ly_anim-next', 'ly_anim-prev');
    void ly_card.offsetWidth;
    ly_card.classList.add(ly_dir === 'prev' ? 'ly_anim-prev' : 'ly_anim-next');
  }

  /**
   * 把当前 scale、rotate 和平移量应用到图片上，并同步显示缩放倍数与旋转角度
   */
  function ly_apply() {
    document.getElementById('ly_pic').style.transform =
      'translate3d(' + ly_tx + 'px,' + ly_ty + 'px,0) rotate(' + ly_rot + 'deg) scale(' + ly_scale + ')';
    document.getElementById('ly_scalebox').textContent =
      '缩放 ' + ly_scale.toFixed(1) + 'x · 旋转 ' + Math.round(ly_rot) + '°';
  }

  /**
   * 松手/切卡时把平移量限制在边界内：图片缩放后超出部分不允许拖出卡片，1x 时强制复位
   */
  function ly_clamp() {
    if (ly_scale <= ly_minScale) {
      ly_tx = 0;
      ly_ty = 0;
      return;
    }
    var ly_card = document.getElementById('ly_card');
    var ly_imgH = document.getElementById('ly_pic').offsetHeight;
    var ly_w = ly_card.clientWidth;
    // X 方向可移动区间 [卡片宽 - 缩放后宽, 0]；Y 方向保证图片始终盖住自己原来的区域 [图高 - 缩放后高, 0]
    var ly_minX = ly_w - ly_w * ly_scale;
    var ly_minY = ly_imgH - ly_imgH * ly_scale;
    ly_tx = Math.min(0, Math.max(ly_minX, ly_tx));
    ly_ty = Math.min(0, Math.max(ly_minY, ly_ty));
  }

  /**
   * 把容器内坐标换算回图片坐标系（逆变换）：图片坐标 = (1/scale) · R(-rot) · (容器坐标 - 平移量)
   * @param {number} ly_px - 容器内 X 坐标
   * @param {number} ly_py - 容器内 Y 坐标
   * @returns {number} 图片坐标 X
   */
  function ly_toImgX(ly_px, ly_py) {
    var ly_rad = ly_rot * Math.PI / 180;
    var ly_dx = ly_px - ly_tx;
    var ly_dy = ly_py - ly_ty;
    return (ly_dx * Math.cos(ly_rad) + ly_dy * Math.sin(ly_rad)) / ly_scale;
  }

  /**
   * 同 ly_toImgX，返回图片坐标系 Y 分量
   * @param {number} ly_px - 容器内 X 坐标
   * @param {number} ly_py - 容器内 Y 坐标
   * @returns {number} 图片坐标 Y
   */
  function ly_toImgY(ly_px, ly_py) {
    var ly_rad = ly_rot * Math.PI / 180;
    var ly_dx = ly_px - ly_tx;
    var ly_dy = ly_py - ly_ty;
    return (-ly_dx * Math.sin(ly_rad) + ly_dy * Math.cos(ly_rad)) / ly_scale;
  }

  /**
   * 以容器内某点为锚点缩放：先算出锚点对应的图片坐标，缩放后让锚点仍指向同一图片位置
   * @param {number} ly_px - 锚点在容器内的 X 坐标
   * @param {number} ly_py - 锚点在容器内的 Y 坐标
   * @param {number} ly_target - 目标倍数（会被钳制在 1～4）
   */
  function ly_zoomAt(ly_px, ly_py, ly_target) {
    ly_anchorImgX = ly_toImgX(ly_px, ly_py);
    ly_anchorImgY = ly_toImgY(ly_px, ly_py);
    ly_scale = Math.min(ly_maxScale, Math.max(ly_minScale, ly_target));
    // 正变换：平移量 = 锚点 - scale · R(rot) · 图片锚点坐标（旋转保持不变）
    var ly_rad = ly_rot * Math.PI / 180;
    ly_tx = ly_px - ly_scale * (ly_anchorImgX * Math.cos(ly_rad) - ly_anchorImgY * Math.sin(ly_rad));
    ly_ty = ly_py - ly_scale * (ly_anchorImgX * Math.sin(ly_rad) + ly_anchorImgY * Math.cos(ly_rad));
    ly_clamp();
    ly_apply();
  }

  /**
   * 计算两指间距
   * @param {Touch} ly_a - 第一根手指
   * @param {Touch} ly_b - 第二根手指
   * @returns {number} 两指间距（px）
   */
  function ly_dist(ly_a, ly_b) {
    var ly_dx = ly_a.clientX - ly_b.clientX;
    var ly_dy = ly_a.clientY - ly_b.clientY;
    return Math.sqrt(ly_dx * ly_dx + ly_dy * ly_dy);
  }

  /**
   * 用 Math.atan2 计算两指连线相对水平方向的角度（deg），用于双指旋转
   * @param {Touch} ly_a - 第一根手指
   * @param {Touch} ly_b - 第二根手指
   * @returns {number} 角度（-180～180）
   */
  function ly_angleOf(ly_a, ly_b) {
    return Math.atan2(ly_b.clientY - ly_a.clientY, ly_b.clientX - ly_a.clientX) * 180 / Math.PI;
  }

  /**
   * 触摸开始：单指同时记录滑动切卡起点与拖动基准；双指记录初始间距、初始倍数和两指中点锚点
   * @param {TouchEvent} ly_e - 触摸事件对象
   */
  function ly_onTouchStart(ly_e) {
    // 手势开始时先去掉过渡动画类，避免捏合/拖动跟手延迟
    ly_removeTransition();
    if (ly_e.touches.length === 1) {
      // 单指：记录滑动切卡起点 + 拖动基准
      ly_swipeX = ly_e.touches[0].clientX;
      ly_swipeY = ly_e.touches[0].clientY;
      ly_dragX = ly_e.touches[0].clientX;
      ly_dragY = ly_e.touches[0].clientY;
      ly_dragBaseX = ly_tx;
      ly_dragBaseY = ly_ty;
    } else if (ly_e.touches.length === 2) {
      // 双指：记录初始间距、初始倍数、初始两指角度与初始旋转角，并把两指中点（换算到容器内坐标）作为缩放/旋转锚点
      ly_pinchDist = ly_dist(ly_e.touches[0], ly_e.touches[1]);
      ly_pinchScale = ly_scale;
      ly_pinchAngle = ly_angleOf(ly_e.touches[0], ly_e.touches[1]);
      ly_pinchRot = ly_rot;
      var ly_r = document.getElementById('ly_viewer').getBoundingClientRect();
      ly_anchorX = (ly_e.touches[0].clientX + ly_e.touches[1].clientX) / 2 - ly_r.left;
      ly_anchorY = (ly_e.touches[0].clientY + ly_e.touches[1].clientY) / 2 - ly_r.top;
      ly_anchorImgX = ly_toImgX(ly_anchorX, ly_anchorY);
      ly_anchorImgY = ly_toImgY(ly_anchorX, ly_anchorY);
    }
  }

  /**
   * 触摸移动：双指按距离比例缩放（锚点为两指中点）；单指且已放大时拖动图片；1x 时交给 touchend 判定滑动切卡
   * @param {TouchEvent} ly_e - 触摸事件对象
   */
  function ly_onTouchMove(ly_e) {
    // 阻止浏览器默认的页面缩放/滚动行为
    ly_e.preventDefault();
    if (ly_e.touches.length === 2) {
      // 按两指当前距离与初始距离的比值算新倍数，钳制在 1～4
      var ly_newScale = ly_pinchScale * ly_dist(ly_e.touches[0], ly_e.touches[1]) / ly_pinchDist;
      ly_scale = Math.min(ly_maxScale, Math.max(ly_minScale, ly_newScale));
      // 双指旋转：当前两指角度与初始角度的差即旋转量（atan2 角度差），叠加到捏合开始时的旋转角上
      var ly_delta = ly_angleOf(ly_e.touches[0], ly_e.touches[1]) - ly_pinchAngle;
      if (ly_delta > 180) { ly_delta -= 360; }
      if (ly_delta < -180) { ly_delta += 360; }
      ly_rot = ly_pinchRot + ly_delta;
      // 锚点（初始两指中点）对应的图片内容保持不动，按正变换反推出新的平移量
      var ly_rad = ly_rot * Math.PI / 180;
      ly_tx = ly_anchorX - ly_scale * (ly_anchorImgX * Math.cos(ly_rad) - ly_anchorImgY * Math.sin(ly_rad));
      ly_ty = ly_anchorY - ly_scale * (ly_anchorImgX * Math.sin(ly_rad) + ly_anchorImgY * Math.cos(ly_rad));
      ly_clamp();
      ly_apply();
    } else if (ly_e.touches.length === 1 && ly_scale > ly_minScale) {
      // 单指且已放大：按手指位移拖动图片（1x 时单指移动留给滑动切卡判定）
      ly_tx = ly_dragBaseX + (ly_e.touches[0].clientX - ly_dragX);
      ly_ty = ly_dragBaseY + (ly_e.touches[0].clientY - ly_dragY);
      ly_apply();
    }
  }

  /**
   * 触摸结束：双指剩一指时重置拖动基准；全部松手时夹回边界、做双击检测，1x 时判定滑动切卡
   * @param {TouchEvent} ly_e - 触摸事件对象
   */
  function ly_onTouchEnd(ly_e) {
    // 防御：无任何抬起触点信息时直接返回（如异常派发的事件）
    if (!ly_e.changedTouches || ly_e.changedTouches.length === 0) { return; }
    if (ly_e.touches.length === 1) {
      // 双指捏合后抬起一根：以剩余手指为起点重置拖动基准，实现无缝接续拖动
      ly_dragX = ly_e.touches[0].clientX;
      ly_dragY = ly_e.touches[0].clientY;
      ly_dragBaseX = ly_tx;
      ly_dragBaseY = ly_ty;
      return;
    }
    if (ly_e.touches.length === 0) {
      // 全部松手：把图片位置夹回边界内
      ly_clamp();
      ly_apply();
      // 双击检测：300ms 内两次抬手且位移很小则判定为双击
      var ly_x = ly_e.changedTouches[0].clientX;
      var ly_y = ly_e.changedTouches[0].clientY;
      var ly_now = Date.now();
      if (ly_now - ly_lastTapTime < 300 &&
          Math.abs(ly_x - ly_lastTapX) < 30 && Math.abs(ly_y - ly_lastTapY) < 30) {
        ly_onDoubleTap(ly_x, ly_y);
        ly_lastTapTime = 0;
      } else {
        ly_lastTapTime = ly_now;
        ly_lastTapX = ly_x;
        ly_lastTapY = ly_y;
      }
      // 滑动切卡判定：只在 1x（未放大）时生效，放大状态下单指属于拖动图片
      if (ly_scale === ly_minScale) {
        var ly_dx = ly_x - ly_swipeX;
        var ly_dy = ly_y - ly_swipeY;
        if (Math.abs(ly_dx) >= ly_threshold && Math.abs(ly_dx) > Math.abs(ly_dy)) {
          if (ly_dx < 0) {
            // 手指向左滑：切到下一张
            ly_switchTo(ly_index + 1, 'next');
          } else {
            // 手指向右滑：切到上一张
            ly_switchTo(ly_index - 1, 'prev');
          }
        }
      }
    }
  }

  /**
   * 双击切换倍数：已放大则复位到 1x，否则以点击点为锚点放大到 2x，均带 0.25s 过渡动画
   * @param {number} ly_x - 双击点的页面 X 坐标
   * @param {number} ly_y - 双击点的页面 Y 坐标
   */
  function ly_onDoubleTap(ly_x, ly_y) {
    var ly_img = document.getElementById('ly_pic');
    // 加过渡类让本次 transform 变化以 0.25s 动画呈现，动画结束后移除以免影响捏合跟手
    ly_img.classList.add('ly_transition');
    clearTimeout(ly_transTimer);
    ly_transTimer = setTimeout(function () { ly_img.classList.remove('ly_transition'); }, 260);
    if (ly_scale > ly_minScale) {
      // 复位到 1x（旋转角也一并归零）
      ly_scale = ly_minScale;
      ly_rot = 0;
      ly_tx = 0;
      ly_ty = 0;
      ly_apply();
    } else {
      // 以双击点为锚点放大到 2x
      var ly_r = document.getElementById('ly_viewer').getBoundingClientRect();
      ly_zoomAt(ly_x - ly_r.left, ly_y - ly_r.top, 2);
    }
  }

  /**
   * 移除图片上的过渡动画类
   */
  function ly_removeTransition() {
    clearTimeout(ly_transTimer);
    document.getElementById('ly_pic').classList.remove('ly_transition');
  }

  /**
   * 页面初始化：绑定容器上的三个触摸事件，拉取接口数据并渲染第一张卡片
   */
  function ly_init() {
    var ly_viewer = document.getElementById('ly_viewer');
    ly_viewer.addEventListener('touchstart', ly_onTouchStart, { passive: true });
    ly_viewer.addEventListener('touchmove', ly_onTouchMove, { passive: false });
    ly_viewer.addEventListener('touchend', ly_onTouchEnd);
    // 先用本地默认图文立即渲染（不等待接口），再异步拉取接口文字覆盖
    ly_render();
    ly_apply();
    ly_loadData();
  }

  ly_init();
</script>
</body>
